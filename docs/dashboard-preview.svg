<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 970" role="img" aria-labelledby="title description">
  <title id="title">Product Sales Information System dashboard preview</title>
  <desc id="description">A business dashboard with monthly revenue and profit, product sales, stock levels, and quick actions.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#263447" flood-opacity="0.07"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #8793a3; }
      .navy { fill: #263447; }
      .card { fill: #ffffff; stroke: #e9edf3; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="970" rx="22" fill="#f5f7fb"/>
  <rect width="1400" height="68" rx="22" fill="#263447"/>
  <rect y="46" width="1400" height="22" fill="#263447"/>
  <text x="700" y="42" text-anchor="middle" fill="#f4f6f8" font-size="17" font-weight="700" letter-spacing=".5">Product Sales Information System</text>

  <text x="68" y="112" fill="#7c8ca2" font-size="11" font-weight="800" letter-spacing="2">OVERVIEW  •  NOVEMBER 2026</text>
  <circle cx="196" cy="108" r="4" fill="#30b58a"/>
  <text x="68" y="153" fill="#1c2938" font-size="30" font-weight="750">Welcome back. Here's your overview.</text>
  <text x="68" y="181" class="muted" font-size="14">Review sales and inventory for November 2026.</text>
  <rect x="1220" y="128" width="110" height="38" rx="9" fill="#ffffff" stroke="#e1e7ef"/>
  <text x="1275" y="152" text-anchor="middle" fill="#536174" font-size="12" font-weight="650">↻  Refresh</text>

  <!-- Metric cards -->
  <g filter="url(#shadow)">
    <rect class="card" x="68" y="211" width="306" height="125" rx="13"/>
    <rect class="card" x="390" y="211" width="306" height="125" rx="13"/>
    <rect class="card" x="712" y="211" width="306" height="125" rx="13"/>
    <rect class="card" x="1034" y="211" width="298" height="125" rx="13"/>
  </g>
  <text x="91" y="244" class="muted" font-size="13" font-weight="650">Revenue This Month</text>
  <rect x="326" y="228" width="30" height="30" rx="9" fill="#edf4ff"/><text x="341" y="249" text-anchor="middle" fill="#4683dd" font-size="18" font-weight="700">₩</text>
  <text x="91" y="286" class="navy" font-size="25" font-weight="750">592,300 KRW</text>
  <text x="91" y="313" class="muted" font-size="11">Month-to-date revenue</text>

  <text x="413" y="244" class="muted" font-size="13" font-weight="650">Gross Profit</text>
  <rect x="648" y="228" width="30" height="30" rx="9" fill="#e9f8f2"/><text x="663" y="249" text-anchor="middle" fill="#25a47a" font-size="18" font-weight="700">↗</text>
  <text x="413" y="286" class="navy" font-size="25" font-weight="750">317,600 KRW</text>
  <text x="413" y="313" class="muted" font-size="11">Revenue minus purchase cost</text>

  <text x="735" y="244" class="muted" font-size="13" font-weight="650">Units Sold</text>
  <rect x="970" y="228" width="30" height="30" rx="9" fill="#f3efff"/><text x="985" y="249" text-anchor="middle" fill="#8965cf" font-size="17">▣</text>
  <text x="735" y="286" class="navy" font-size="25" font-weight="750">122 units</text>
  <text x="735" y="313" class="muted" font-size="11">Registered sales quantity</text>

  <text x="1057" y="244" class="muted" font-size="13" font-weight="650">Low-Stock Products</text>
  <rect x="1284" y="228" width="30" height="30" rx="9" fill="#fff5e9"/><text x="1299" y="249" text-anchor="middle" fill="#de9145" font-size="17" font-weight="700">!</text>
  <text x="1057" y="286" class="navy" font-size="25" font-weight="750">2 products</text>
  <text x="1057" y="313" class="muted" font-size="11">5 units or fewer</text>

  <!-- Revenue chart -->
  <g filter="url(#shadow)">
    <rect class="card" x="68" y="356" width="770" height="318" rx="13"/>
    <rect class="card" x="854" y="356" width="478" height="318" rx="13"/>
  </g>
  <text x="93" y="389" fill="#7c8ca2" font-size="10" font-weight="800" letter-spacing="1.6">PERFORMANCE</text>
  <text x="93" y="416" fill="#263447" font-size="17" font-weight="730">Revenue by Product</text>
  <text x="789" y="414" text-anchor="end" fill="#7990aa" font-size="11" font-weight="650">View details  →</text>

  <g font-size="12" fill="#58677a">
    <text x="99" y="461" fill="#aab5c2" font-size="10" font-weight="750">01</text><text x="128" y="461">TOTE-BAG</text><text x="805" y="461" text-anchor="end" fill="#354255" font-size="11" font-weight="700">129,000 KRW</text>
    <text x="99" y="504" fill="#aab5c2" font-size="10" font-weight="750">02</text><text x="128" y="504">WATER-BOTTLE</text><text x="805" y="504" text-anchor="end" fill="#354255" font-size="11" font-weight="700">89,400 KRW</text>
    <text x="99" y="547" fill="#aab5c2" font-size="10" font-weight="750">03</text><text x="128" y="547">USB-CABLE</text><text x="805" y="547" text-anchor="end" fill="#354255" font-size="11" font-weight="700">88,500 KRW</text>
    <text x="99" y="590" fill="#aab5c2" font-size="10" font-weight="750">04</text><text x="128" y="590">DESK-LAMP</text><text x="805" y="590" text-anchor="end" fill="#354255" font-size="11" font-weight="700">74,700 KRW</text>
    <text x="99" y="633" fill="#aab5c2" font-size="10" font-weight="750">05</text><text x="128" y="633">KEYBOARD-MINI</text><text x="805" y="633" text-anchor="end" fill="#354255" font-size="11" font-weight="700">65,800 KRW</text>
  </g>
  <g>
    <rect x="128" y="469" width="667" height="7" rx="4" fill="#f0f3f7"/><rect x="128" y="469" width="667" height="7" rx="4" fill="#6394e7"/>
    <rect x="128" y="512" width="667" height="7" rx="4" fill="#f0f3f7"/><rect x="128" y="512" width="462" height="7" rx="4" fill="#55b99c"/>
    <rect x="128" y="555" width="667" height="7" rx="4" fill="#f0f3f7"/><rect x="128" y="555" width="457" height="7" rx="4" fill="#a28adf"/>
    <rect x="128" y="598" width="667" height="7" rx="4" fill="#f0f3f7"/><rect x="128" y="598" width="386" height="7" rx="4" fill="#e7b36a"/>
    <rect x="128" y="641" width="667" height="7" rx="4" fill="#f0f3f7"/><rect x="128" y="641" width="340" height="7" rx="4" fill="#73b8d2"/>
  </g>

  <!-- Inventory overview -->
  <text x="879" y="389" fill="#7c8ca2" font-size="10" font-weight="800" letter-spacing="1.6">INVENTORY</text>
  <text x="879" y="416" fill="#263447" font-size="17" font-weight="730">Stock Overview</text>
  <text x="1305" y="414" text-anchor="end" fill="#7990aa" font-size="11" font-weight="650">View all  →</text>
  <rect x="879" y="438" width="428" height="75" rx="10" fill="#f7f9fc"/>
  <rect x="894" y="457" width="38" height="38" rx="10" fill="#eaf2ff"/><text x="913" y="483" text-anchor="middle" fill="#5988d1" font-size="18">▣</text>
  <text x="947" y="468" fill="#29384b" font-size="17" font-weight="750">8 <tspan font-size="10" font-weight="600">products</tspan></text>
  <text x="947" y="490" class="muted" font-size="10">Products tracked</text>
  <line x1="1094" y1="458" x2="1094" y2="496" stroke="#e4e9f0"/>
  <text x="1113" y="468" fill="#db8b43" font-size="17" font-weight="750">2 <tspan font-size="10" font-weight="600">products</tspan></text>
  <text x="1113" y="490" class="muted" font-size="10">Low stock</text>
  <g font-size="11">
    <circle cx="891" cy="540" r="3" fill="#45b78e"/><text x="903" y="544" fill="#58677a">MUG-CERAMIC</text><text x="1305" y="544" text-anchor="end" fill="#405064" font-weight="700">24 units</text>
    <line x1="879" y1="554" x2="1307" y2="554" stroke="#f1f3f6"/>
    <circle cx="891" cy="572" r="3" fill="#e8a24f"/><text x="903" y="576" fill="#58677a">DESK-LAMP</text><text x="1305" y="576" text-anchor="end" fill="#db8b43" font-weight="700">6 units</text>
    <line x1="879" y1="586" x2="1307" y2="586" stroke="#f1f3f6"/>
    <circle cx="891" cy="604" r="3" fill="#45b78e"/><text x="903" y="608" fill="#58677a">NOTEBOOK-A5</text><text x="1305" y="608" text-anchor="end" fill="#405064" font-weight="700">53 units</text>
    <line x1="879" y1="618" x2="1307" y2="618" stroke="#f1f3f6"/>
    <circle cx="891" cy="636" r="3" fill="#e8a24f"/><text x="903" y="640" fill="#58677a">TOTE-BAG</text><text x="1305" y="640" text-anchor="end" fill="#db8b43" font-weight="700">0 units</text>
  </g>

  <!-- Quick actions -->
  <text x="68" y="714" fill="#7c8ca2" font-size="10" font-weight="800" letter-spacing="1.6">QUICK ACCESS</text>
  <text x="68" y="740" fill="#263447" font-size="17" font-weight="730">Quick Actions</text>
  <g filter="url(#shadow)">
    <rect class="card" x="68" y="759" width="616" height="62" rx="12"/>
    <rect class="card" x="700" y="759" width="632" height="62" rx="12"/>
    <rect class="card" x="68" y="833" width="616" height="62" rx="12"/>
    <rect class="card" x="700" y="833" width="632" height="62" rx="12"/>
  </g>
  <rect x="84" y="771" width="38" height="38" rx="10" fill="#edf4ff"/><text x="103" y="796" text-anchor="middle" fill="#4683dd" font-size="18">▣</text>
  <text x="136" y="785" fill="#344256" font-size="12" font-weight="720">Enter Sales</text><text x="136" y="803" class="muted" font-size="10">Record sales quantities for your products</text><text x="656" y="798" text-anchor="end" fill="#aeb8c4" font-size="18">→</text>
  <rect x="716" y="771" width="38" height="38" rx="10" fill="#e9f8f2"/><text x="735" y="796" text-anchor="middle" fill="#25a47a" font-size="18">↗</text>
  <text x="768" y="785" fill="#344256" font-size="12" font-weight="720">Revenue &amp; Profit</text><text x="768" y="803" class="muted" font-size="10">Review monthly performance by product</text><text x="1304" y="798" text-anchor="end" fill="#aeb8c4" font-size="18">→</text>

  <rect x="84" y="845" width="38" height="38" rx="10" fill="#f3efff"/><text x="103" y="870" text-anchor="middle" fill="#8965cf" font-size="18">▣</text>
  <text x="136" y="859" fill="#344256" font-size="12" font-weight="720">Manage Products</text><text x="136" y="877" class="muted" font-size="10">Maintain products and selling prices</text><text x="656" y="872" text-anchor="end" fill="#aeb8c4" font-size="18">→</text>
  <rect x="716" y="845" width="38" height="38" rx="10" fill="#fff5e9"/><text x="735" y="870" text-anchor="middle" fill="#de9145" font-size="18">▣</text>
  <text x="768" y="859" fill="#344256" font-size="12" font-weight="720">Current Inventory</text><text x="768" y="877" class="muted" font-size="10">Review stock and record incoming units</text><text x="1304" y="872" text-anchor="end" fill="#aeb8c4" font-size="18">→</text>

  <text x="700" y="944" text-anchor="middle" fill="#a7b0bc" font-size="10">Product Sales Information System  ·  Your business overview at a glance</text>
</svg>
